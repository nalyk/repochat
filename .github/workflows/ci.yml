name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Vet and format
        run: make vet
      - name: Tests (race detector)
        run: make test-race
      - name: First-run onboarding through a pseudo-terminal
        run: make test-onboarding
      - name: Fuzz the input validators (short)
        run: make fuzz
      - name: Cross-compile
        run: make dist
