name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Checks
        run: make check
      # A release must have passed the contract suite against the real,
      # checksum-pinned tunnel-client. A missing binary fails the job.
      - name: Install the pinned tunnel-client
        run: |
          make build
          ./repochat install-helper --yes
      - name: Contract suite (real tunnel-client, mock control plane)
        run: make test-contract
      - name: Build release archives
        run: make dist VERSION=${GITHUB_REF_NAME}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS.txt --generate-notes --verify-tag
