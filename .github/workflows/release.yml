name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  # Everything CI runs, on both systems the archives are built for. A tag can
  # be pushed on any commit; this is what stands between it and a release.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A release is cut from main. This establishes that the tagged commit
      # is part of main, nothing more: it is not proof that CI passed on it
      # (the Checks step below is), and it cannot stop someone who may push
      # tags from changing this file. Protect main and the v* tags as well.
      - name: The tagged commit must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Checks
        run: make check
      - name: Fuzz the input validators (short)
        run: make fuzz

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # A release must have passed the contract suite against the real,
      # checksum-pinned tunnel-client. A missing binary fails the job.
      - name: Install the pinned tunnel-client
        run: |
          make build
          ./repochat install-helper --yes
      - name: Contract suite (real tunnel-client, mock control plane)
        run: make test-contract
      - name: Build release archives
        run: make dist VERSION=${GITHUB_REF_NAME}
      # GitHub offers artifact attestations to private repositories only on
      # Enterprise Cloud. While this repository is private the step is skipped,
      # so that it cannot fail the job before the release is published; the
      # archives still ship with SHA256SUMS.txt.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS.txt --generate-notes --verify-tag
